    <title>制度運用の課題：資産把握と就労意欲の維持</title>
    <style>
        body { font-family: sans-serif; line-height: 1.8; color: #333; max-width: 800px; margin: 0 auto; padding: 40px 20px; background-color: #fffbeb; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 8px solid #d97706; }
        h1 { color: #92400e; font-size: 1.7rem; margin-bottom: 30px; }
        h2 { color: #b45309; border-bottom: 2px solid #fef3c7; padding-bottom: 5px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>制度運用の課題：資産把握と就労意欲の維持</h1>
        <p>制度の導入には、高度な実務設計と社会基盤の整備が不可欠です。</p>

        <h2>1. 所得・資産の正確な捕捉</h2>
        <p>マイナンバー制度を活用し、給与所得だけでなく預貯金や不動産等の資産情報（ストック）をいかに正確に紐付けるかが、公平性を担保する上での最大の鍵となります。</p>

        <h2>2. 就労インセンティブの設計</h2>
        <p>「一定の年収を超えると給付が急激に減る」という状況（いわゆる「年収の壁」）を避けなければなりません。所得上昇に合わせて緩やかに給付を減らす「なだらかなスロープ」の設計が、就労意欲を維持するために求められます。</p>
    </div>
</body>
