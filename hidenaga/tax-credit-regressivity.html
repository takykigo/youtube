<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逆進性対策と消費税：低所得者層への実効的な支援</title>
    <style>
        body { font-family: sans-serif; line-height: 1.8; color: #333; max-width: 800px; margin: 0 auto; padding: 40px 20px; background-color: #fcf4ff; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 8px solid #7c3aed; }
        h1 { color: #5b21b6; font-size: 1.7rem; margin-bottom: 30px; }
        h2 { color: #6d28d9; border-left: 5px solid #7c3aed; padding-left: 15px; margin-top: 30px; }
        .compare-box { background: #f5f3ff; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid #ddd6fe; }
    </style>
</head>
<body>
    <div class="card">
        <h1>逆進性対策と消費税：低所得者層への実効的な支援</h1>
        <p>消費税には、所得の低い人ほど生活必需品などの購入負担が相対的に重くなる「逆進性」という構造的な課題が存在します。</p>

        <h2>1. 軽減税率との比較</h2>
        <div class="compare-box">
            特定の商品を減税する「軽減税率」に対し、給付付き税額控除は<strong>「支援が必要な世帯」に直接現金を還元</strong>します。これにより、高所得者ほど恩恵が大きくなる「逆転現象」を防ぎ、より公平な負担軽減が可能となります。
        </div>

        <h2>2. 実質的な購買力の補填</h2>
        <p>低所得層へ直接給付を行うことで、増税による実質的な可処分所得の低下をピンポイントで補填し、経済全体の消費活動の下支えを目指します。</p>
    </div>
</body>
</html>
