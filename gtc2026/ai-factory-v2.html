<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AIファクトリーとトークン経済</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; line-height: 1.8; max-width: 1200px; margin: 40px auto; padding: 25px; color: #333; background-color: #f4f7f9; }
        .explanation-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .image-container { text-align: center; margin: 25px 0; border: 1px solid #ddd; border-radius: 8px; padding: 10px; background: #fff; }
        .image-container img { width: 100%; height: auto; border-radius: 4px; }
        h1 { color: #0056b3; font-size: 1.8em; border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 20px; }
        .column { background: #fafafa; padding: 20px; border-radius: 5px; border: 1px solid #eee; }
        h2 { color: #0056b3; font-size: 1.4em; margin-top: 0; border-left: 5px solid #0056b3; padding-left: 15px; }
    </style>
</head>
<body>

<div class="explanation-box">
    <h1>AIファクトリーとトークン経済：次世代インテリジェンス革命の全貌</h1>

    <div class="image-container">
        <img src="ai-factory-image.jpg" alt="AIファクトリーとトークン経済 解説図">
    </div>

    <div class="grid">
        <div class="column">
            <h2>AIファクトリーと「トークン」経済</h2>
            <p>AIが生成する「トークン」が次世代の主要な商品となり、計算資源が価値を生む新経済が始まります。</p>
        </div>
        <div class="column">
            <h2>エージェントとフィジカルAI</h2>
            <p>道具としてのAIから、自律的に考え行動するエージェント、そして現実世界で働くフィジカルAIへと進化します。</p>
        </div>
    </div>
</div>

</body>
</html>
